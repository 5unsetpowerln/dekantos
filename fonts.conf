<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig setup that run.sh passes to Wine through FONTCONFIG_FILE.
  Wine takes the antialiasing mode of every font from fontconfig, ahead of the ClearType setting
  in the registry. Hosts commonly enable antialiasing without a subpixel order, which makes Wine
  use grayscale, and the gasp table of UI fonts such as Tahoma turns grayscale off at small sizes.
  Windows uses ClearType by default, so ask for RGB subpixel rendering on top of the host setup.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>
  <match target="font">
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>
</fontconfig>
